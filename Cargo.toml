[package]
name = "helmsniff-ng"
version = "0.1.0"
edition = "2024"
description = "Scans rendered Kubernetes/Helm manifests and reports security misconfigurations as CSV or JSON"
license = "MIT"
repository = "https://github.com/VahidR/helmsniff-ng"
readme = "README.md"
rust-version = "1.85"

[[bin]]
name = "helmsniff-ng"
path = "src/main.rs"

[dependencies]
# CLI flags (--root, --out, --format); exits 2 on usage errors like Go's flag package
clap = { version = "4.5", features = ["derive"] }
# YAML -> untyped Value tree. Maintained fork of serde_yaml; libyaml lineage = same parser family as Go's yaml.v3
serde_yaml_ng = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
